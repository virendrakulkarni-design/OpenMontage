<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Cute Custom Fox Character Asset -->
  <!-- Bushy Tail -->
  <path d="M40,160 Q10,130 15,90 Q40,100 55,140 Z" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>
  <path d="M15,90 Q22,80 30,95 Q25,105 15,90 Z" fill="#FFFFFF"/>
  
  <!-- Back Ears -->
  <polygon points="50,60 30,10 75,40" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>
  <polygon points="48,55 35,22 68,42" fill="#FED7AA"/>
  <polygon points="150,60 170,10 125,40" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>
  <polygon points="152,55 165,22 132,42" fill="#FED7AA"/>

  <!-- Body -->
  <ellipse cx="100" cy="150" rx="45" ry="50" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>
  <!-- White Chest Fur -->
  <ellipse cx="100" cy="155" rx="25" ry="35" fill="#FFF7ED"/>

  <!-- Scarf / Bandana -->
  <path d="M70,115 Q100,135 130,115 L125,128 Q100,145 75,128 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
  <polygon points="100,132 110,150 95,145" fill="#3B82F6"/>

  <!-- Head -->
  <ellipse cx="100" cy="75" rx="48" ry="40" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>
  <!-- White Cheeks -->
  <path d="M60,85 Q80,105 100,105 Q120,105 140,85 Q145,95 135,102 Q100,115 65,102 Z" fill="#FFF7ED"/>

  <!-- Big Sparkling Eyes -->
  <ellipse cx="80" cy="70" rx="8" ry="12" fill="#1E293B"/>
  <circle cx="78" cy="66" r="3.5" fill="#FFFFFF"/>
  <circle cx="82" cy="75" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="120" cy="70" rx="8" ry="12" fill="#1E293B"/>
  <circle cx="118" cy="66" r="3.5" fill="#FFFFFF"/>
  <circle cx="122" cy="75" r="1.5" fill="#FFFFFF"/>

  <!-- Cute Nose -->
  <polygon points="95,88 105,88 100,94" fill="#0F172A"/>

  <!-- Mouth -->
  <path d="M93,97 Q100,103 107,97" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Paws / Legs -->
  <ellipse cx="75" cy="205" rx="14" ry="10" fill="#0F172A"/>
  <ellipse cx="125" cy="205" rx="14" ry="10" fill="#0F172A"/>
</svg>
